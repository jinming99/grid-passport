[package]
name = "grid-passport-desktop"
version = "0.0.0"
description = "Grid Passport — confidential coordination workflow (desktop shell)"
authors = ["Grid Passport team"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/jinming99/grid-passport"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "grid_passport_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
